[mypy]
python_version = 3.10
strict = True
ignore_missing_imports = True
packages = invoice_ocr
exclude = tests/

[mypy-invoice_ocr.io.jsonl]
disable_error_code = attr-defined

[mypy-invoice_ocr.preprocessing.orientation]
disable_error_code = arg-type

[mypy-invoice_ocr.stages]
disable_error_code = return-value

